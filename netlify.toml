[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[redirects]]
  from = "https://agent-fde.netlify.app/*"
  to = "https://workauto.co.kr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://agent-fde.netlify.app/*"
  to = "https://workauto.co.kr/:splat"
  status = 301
  force = true

[[headers]]
  for = "/__forms.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[plugins]]
  package = "@netlify/plugin-nextjs"
